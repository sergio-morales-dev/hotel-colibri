# =====================================================================
# application.properties  ·  Hotel Colibrí — Configuración de la API REST
# ---------------------------------------------------------------------
# Spring Boot lee este archivo al arrancar. Aquí va TODO lo que cambia
# entre computadoras (base de datos, puertos, direcciones de servicios)
# para no escribirlo "a mano" dentro del código Java.
#
# Seguridad: este archivo SÍ se sube a GitHub, por eso NO lleva la
# contraseña. ${DB_PASSWORD} significa "léela de la variable de entorno
# DB_PASSWORD"; cada integrante la define en su propia terminal.
# =====================================================================

spring.application.name=api
server.port=8080

# ---------------------------------------------------------------------
# Base de datos MySQL
# createDatabaseIfNotExist=true -> si la base hotel_colibri no existe,
# MySQL la crea al conectarse (no hay que hacer CREATE DATABASE a mano).
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_colibri?createDatabaseIfNotExist=true
# ${DB_USER:root} -> usa la variable DB_USER; si no existe, usa "root".
spring.datasource.username=${DB_USER:root}
# Sin valor por defecto A PROPÓSITO: si olvidas definir DB_PASSWORD,
# la API no arranca y el error lo dice claro (mejor que fallar a medias).
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------
# JPA / Hibernate
# update -> crea o ajusta las tablas a partir de las entidades @Entity,
#           sin borrar los datos que ya existen.
# open-in-view=false -> la conexión a la BD se cierra al terminar el
#           service, no hasta que se arma el JSON (buena práctica y
#           quita una advertencia al arrancar).
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Errores (regla del proyecto: ProblemDetail y SIN trazas internas)
# problemdetails.enabled -> los errores propios de Spring (JSON mal
#           escrito, parámetro faltante...) también salen como ProblemDetail.
# include-stacktrace=never -> nunca se envía el stack trace al cliente.
# ---------------------------------------------------------------------
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# ---------------------------------------------------------------------
# Servicio SOAP de divisas (se usa en la fase 4)
# La dirección va aquí y no en el código: si el servicio cambia de
# máquina o de puerto, solo se edita esta línea.
# ---------------------------------------------------------------------
divisas.soap.url=http://localhost:8001/
